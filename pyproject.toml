[project]
name = "wroclaw-population-agents"
version = "0.1.0"
description = "System agentów VLM szacujący liczbę mieszkańców pojedynczych budynków we Wrocławiu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "geopandas>=1.2.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.11.2",
    "nbstripout>=0.8.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ortofoto", "src/agenci"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
